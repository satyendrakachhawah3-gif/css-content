<!doctype html>
<html lang="en">

<head>
  <title>CSS Position Property</title>
  <style>
    .container {
      border: 1px solid black;
      position: relative;
      height: 5000px;
    }

    img {
      margin: 10px;
    }

    /* .image2 {
      position: relative;
      top: 100px;
      left: 100px;
    }
      */
    /* .image2 {
      position: absolute;
    } */
    .image4 {
      position: fixed;
    }

    .image3 {
      position: sticky;
      top: 200px;
    }

    .box {
      background: aquamarine;
      height: 5000px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="../assets/image/images.jpg" alt="poster1" width="300px" height="300px" class="image1">
    <img src="../assets/image/1687950308983.jpg" alt="poster2" width="300px" height="300px" class="image2">
    <img src="../assets/image/1692448099839.jpg" alt="poster3" width="300px" height="300px" class="image3">
    <img src="../assets/image/images.jpg" alt="poster4" width="300px" height="300px" class="image4">
  </div>
  <div class="box">

  </div>

</body>

</html>
